# Release configuration for GoReleaser (https://goreleaser.com).
#
# Pushing a v* tag runs .github/workflows/release.yml, which runs this:
# build a universal macOS binary, sign and notarize it, publish a GitHub
# release, and update the gt cask in the Homebrew tap. docs/releasing.md
# describes the secrets it needs.
version: 2

project_name: gt

builds:
  - id: gt
    main: ./cmd/gt
    binary: gt
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One binary that runs on both Apple silicon and Intel Macs, signed and
# notarized before it is archived. The script waits for Apple's verdict, so a
# rejected binary fails the release before anything is published. It leaves
# the binary unsigned when there is no signing keychain (local snapshots);
# the release workflow always provides one.
universal_binaries:
  - id: gt
    ids: [gt]
    replace: true
    hooks:
      post:
        - cmd: ./scripts/sign-and-notarize.sh "{{ .Path }}"
          output: true

archives:
  - id: gt
    ids: [gt]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_macos"
    files:
      - LICENSE
      - README.md
      - docs/configuration.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: jakeobsen
    name: gt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^test"

homebrew_casks:
  - name: gt
    ids: [gt]
    binaries: [gt]
    homepage: https://github.com/jakeobsen/gt
    description: Keyboard launcher for the terminal
    repository:
      owner: jakeobsen
      name: homebrew-tap
      branch: mainline
      git:
        url: git@github.com:jakeobsen/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
